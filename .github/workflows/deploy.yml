# Builds the website and publishes it to GitHub Pages on every push to "main".
# If a staff edit breaks a data file, the "Build" step fails and the live site keeps the previous version.
name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 06:00 Malaysia time, so profiles newly published or edited in the staff dashboard
  # appear without a manual push (availability changes already show live). Also keeps the free database active.
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Preview on GitHub Pages project URL. For a custom domain, set repository variables
  # SITE_URL=https://www.your-domain.com and BASE_PATH=/  (Settings → Secrets and variables → Actions → Variables)
  SITE_URL: ${{ vars.SITE_URL || 'https://yukisph88.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/final-choice-maid-agency' }}
  # Demo profiles (fictional, clearly labelled) are OFF: the directory shows only real, consented profiles.
  # Set the repository variable PUBLIC_DEMO_CANDIDATES=true only for a layout test.
  PUBLIC_DEMO_CANDIDATES: ${{ vars.PUBLIC_DEMO_CANDIDATES || 'false' }}
  # Supabase database: only the PUBLIC project URL and PUBLIC (publishable) key belong here — they are designed to be public.
  # NEVER the secret/service-role key. Repository variables of the same names override these defaults.
  # PUBLIC_MAIDS_SOURCE=supabase builds the maid profiles from the database (set it only at go-live).
  PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || 'https://bxgzgagtssjbauylrzqz.supabase.co' }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_BsXQvtdpj3N_9KnXHcTpwg_FV7-UMlO' }}
  PUBLIC_MAIDS_SOURCE: ${{ vars.PUBLIC_MAIDS_SOURCE || 'files' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so sitemap lastmod dates come from real commit dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep the free Supabase project active (it pauses after a week without use)
        run: |
          curl -fsS -m 30 -X POST "$PUBLIC_SUPABASE_URL/rest/v1/rpc/public_maid_status" -H "apikey: $PUBLIC_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' > /dev/null || echo "Supabase did not answer (it may be paused) — the website build continues"
      - name: Build
        run: npm run build
      - name: Quality checks (links, titles, structured data, privacy patterns)
        run: npm run test:site
      - name: Biodata PDFs (every published maid has a correct PDF; no private data; no PDF for anyone else)
        run: npm run test:biodata
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
