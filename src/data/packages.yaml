# =====================================================================
#  FINAL CHOICE — MAID PACKAGES (prices, terms and inclusions)
#  ONE file for the homepage, the Packages page and the nationality pages,
#  in English and Bahasa Melayu.
#
#  HOW TO CHANGE A PRICE
#    Find the category and package below and change the number after
#    "price:". Numbers only — no "RM", no commas (e.g. 15600).
#    To hide a price and show "Request a quotation" instead, use:  price: null
#
#  HOW TO CHANGE A TERM OR INCLUSION
#    Each line has "text" (English), "text_ms" (Bahasa Melayu) and "verified".
#    Only lines with  verified: true  are shown on the website.
#    "terms"     = shown on that package card only (warranty, fees, insurance …)
#    "includes"  = shown once under the cards, for every package in that category
#
#  Each category has its OWN terms on purpose. Never copy one category's terms
#  to another without written confirmation from management.
#
#  Source: package brochures (Indonesia, Indonesian Christian, Philippines),
#  photographed and checked line by line on 15/10/2026. All prices are FINAL
#  prices including 8% SST (company absorbs part of the SST). Prices are shown as
#  "subject to confirmation" until management approves the current price list.
# =====================================================================

priceNote: >-
  Prices are final package prices in Ringgit Malaysia and include 8% SST (part of the
  SST is absorbed by Final Choice). They are subject to confirmation until the current
  price list is approved. Your consultant will confirm
  the final quotation, inclusions and terms in writing before you commit. Warranty,
  replacement and disbursement arrangements are subject to the terms of your service agreement.

priceNote_ms: >-
  Harga yang dipaparkan ialah harga akhir pakej dalam Ringgit Malaysia dan termasuk
  SST 8% (sebahagian SST ditanggung oleh Final Choice). Harga tertakluk kepada pengesahan
  sehingga senarai harga terkini diluluskan. Perunding kami
  akan mengesahkan sebut harga akhir, kandungan pakej dan terma secara bertulis sebelum
  anda membuat keputusan. Waranti, penggantian dan yuran disbursement tertakluk kepada
  terma perjanjian perkhidmatan anda.

