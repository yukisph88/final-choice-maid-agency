# =====================================================================
#  FINAL CHOICE — MAID PACKAGES (prices and inclusions)
#
#  HOW TO CHANGE A PRICE
#    Find the nationality and package below and change the number after
#    "price:". Numbers only — no "RM", no commas (e.g. 15600).
#    To hide a price and show "Request a quotation" instead, use:  price: null
#
#  HOW TO ADD / CHANGE AN INCLUSION
#    Each inclusion has "text" (English), "text_ms" (Bahasa Melayu) and "verified".
#    Prices and "verified" are shared, so both languages always show the same terms.
#    Only inclusions with  verified: true  are shown on the website.
#    Set verified: true ONLY after management has confirmed that term in writing.
#
#  Indonesian and Filipino packages are kept separate on purpose:
#  their terms are NOT assumed to be the same.
# =====================================================================

# Shown under the price cards on every page that displays packages
priceNote: >-
  Prices are reference package prices in Ringgit Malaysia and are subject to
  confirmation. Your consultant will confirm the final quotation, inclusions and
  terms in writing before you commit. Warranty and replacement arrangements are
  subject to the terms of your service agreement.

priceNote_ms: >-
  Harga yang dipaparkan ialah harga rujukan pakej dalam Ringgit Malaysia dan
  tertakluk kepada pengesahan. Perunding kami akan mengesahkan sebut harga, kandungan
  pakej dan terma secara bertulis sebelum anda membuat keputusan. Waranti dan
  penggantian tertakluk kepada terma perjanjian perkhidmatan anda.

# Date the prices were last checked by staff (YYYY-MM-DD)
