#  FINAL CHOICE — FREQUENTLY ASKED QUESTIONS
#  "home: true" also shows the question on the homepage (keep 5–8 there).
#  Keep answers factual. Regulatory details change — check before editing.
# =====================================================================

- q: "How do I hire an Indonesian maid in Malaysia?"
  home: true
  a: >-
    Start by telling our consultant about your household: who needs care, the main duties,
    your preferred language and any religious or dietary considerations. We then share
    suitable Indonesian helper biodata, arrange an interview with your shortlisted candidate,
    and guide you through the employment contract, the application to the relevant authorities
    and the helper's arrival, medical screening and handover. Indonesian placements follow the
    procedures agreed between Malaysia and Indonesia, so your consultant will explain the
    current steps and eligibility checks that apply to your application.

- q: "What documents are needed to hire a domestic helper?"
  home: true
  a: >-
    Employers are usually asked for a copy of their MyKad, proof of income (such as recent
    salary slips, an EA form or bank statements) and proof of address. Depending on your
    household and the helper's nationality, other documents such as a marriage certificate or
    children's birth certificates may be requested. Because requirements are set by the
    authorities and can change, we give you an up-to-date checklist for your specific case
    before you start.

- q: "Can I interview the maid before hiring?"
  home: true
  a: >-
    Yes. After you shortlist a candidate from her biodata, we can arrange an interview, usually
    by video call. It is a good opportunity to ask about her past duties, experience with
    children or elderly people, cooking and her expectations. Your consultant can suggest
    useful questions and help with translation where needed.

- q: "How long does the recruitment process take?"
  home: true
  a: >-
    Timing varies from case to case. It depends on how quickly documents are completed,
    government and embassy approvals, the helper's own travel documents and flight
    arrangements. We will give you an estimated timeline for your application and keep you
    updated, but approval times and arrival dates cannot be guaranteed by any agency.

- q: "What happens after my maid arrives?"
  home: true
  a: >-
    After arrival, the helper must complete a medical examination at a FOMEMA-registered
    clinic, and the remaining work-pass formalities are completed. We provide an orientation
    before handover, covering household expectations and basic working arrangements, and we
    remain available to both employer and helper for follow-up questions after placement.

- q: "Do you provide maid replacement assistance?"
  home: true
  a: >-
    Replacement assistance depends on the package you choose and the terms of your service
    agreement, including the warranty period and any replacement fee. Your consultant will
    explain these terms clearly before you sign, so you know exactly what applies.

- q: "Can Final Choice assist with maid permit renewal?"
  home: true
  a: >-
    Yes. We can guide you through renewing your helper's work permit and employment contract,
    including the documents you need to prepare and the timing. Start the renewal well before
    the current permit expires — contact us early so there is enough time to complete it.

- q: "What is the difference between Indonesian and Filipino helpers?"
  home: true
  a: >-
    Both are popular choices for Malaysian families, and each helper is an individual, so
    experience and personality matter more than nationality. In general, many Indonesian
    helpers communicate in Bahasa Indonesia, which is close to Bahasa Malaysia, while many
    Filipino helpers communicate in English. Recruitment procedures, documentation and package
    terms also differ between the two nationalities. Our consultant can compare both options
    for your household.

- q: "How long is the employment contract?"
  a: >-
    Final Choice generally arranges a two-year employment contract for domestic helpers. Your
    consultant will explain the contract terms, salary and rest-day arrangements that apply to
    your helper's nationality before you sign.

- q: "Is the biodata on the website up to date?"
  a: >-
    We review published profiles regularly, and each profile shows the date its status was
    last updated. Availability can change quickly, so please contact us to confirm a
    candidate's current status before making plans.

- q: "How do you handle my personal information?"
  a: >-
    We use the information you share only to respond to your enquiry and to process your
    application. Please read our privacy policy for details.
